[package]
name = "djox_python"
description = "The Python extension of djox (`djox._core`)"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
djox = { path = "crates/djox" }
# `chrono` and `uuid`: turn the dates and UUIDs Postgres returns into Python's `datetime` and `uuid.UUID`.
pyo3 = { version = "0.30.1", features = ["abi3-py311", "chrono", "uuid"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[workspace]
members = [".", "crates/djox-core", "crates/djox"]

# Settings the crates share. No version: djox is published as a Python package only, and its
# version lives only in pyproject.toml (bump it with `uv version`). The crates aren't published.
[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/daniprol/djox"

[profile.release]
lto = "thin"
codegen-units = 1

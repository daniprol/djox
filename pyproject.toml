[project]
name = "djox"
version = "0.1.0"  # the one place it lives: bump it with `uv version --bump patch`
description = "Truly async Django ORM with a Rust core. Fast and readable, with hooks for library authors. SQLite and Postgres."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daniprol" }]
keywords = ["django", "orm", "async", "asyncio", "sqlite", "postgres", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Documentation = "https://daniprol.github.io/djox/"
Repository = "https://github.com/daniprol/djox"
Changelog = "https://github.com/daniprol/djox/blob/main/CHANGELOG.md"
Issues = "https://github.com/daniprol/djox/issues"

[tool.maturin]
module-name = "djox._core"
python-packages = ["djox"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "crates/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[project.optional-dependencies]
# `uv add "djox[postgres]"`: psycopg 3 for Django's sync code on Postgres, as
# Django's own Postgres backend needs it (djox's async code doesn't).
postgres = ["psycopg[binary]>=3.1.8"]

[dependency-groups]
dev = [
    "django>=5.2",  # tests run SQL written by Django's compiler
    "django-stubs>=6.1",  # type hints for Django, used by mypy and pyrefly
    "maturin>=1.9",
    "mypy>=2.0",
    "prek>=0.5.7",
    "psycopg[binary]>=3.2",  # Django's sync ORM on Postgres (djox.backends.postgresql)
    "pyrefly>=1.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",  # Django's test database and TestCase classes under pytest
    "ruff>=0.14",
]
docs = ["zensical>=0.0.72"]  # uv run --only-group docs zensical serve

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Django's own tests, copied as they are (tests/django_suite/README.md), keep Django's style.
extend-exclude = ["tests/django_suite/*/"]  # every app folder; conftest.py is djox's own
force-exclude = true  # also when prek passes those files by name

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern syntax for Python 3.11+
    "B",       # likely bugs
    "A",       # shadowing builtins
    "C4",      # comprehensions
    "SIM",     # simplifications
    "RET",     # return statements
    "PIE",     # misc. clean-ups
    "PTH",     # pathlib over os.path
    "PT",      # pytest style
    "ASYNC",   # asyncio pitfalls
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]  # written by Django's makemigrations

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "django_ported(source): a test copied from Django's test suite; `source` is its id there (see tests/django_suite/README.md)",
    "django_adapted(reason): a ported Django test changed to fit djox; `reason` says what changed and why",
    "django_unsupported(reason): a ported Django test for a feature djox doesn't support yet; expected to fail",
    "sqlite_only(reason): a test of something only djox's SQLite backend does; skipped on other databases",
]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]  # so `tests.settings` can be imported
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["maturin>=1.9.4,<2.0"]  # 1.9.4 writes the PEP 639 license metadata
build-backend = "maturin"

# Two type checkers, both reading Django's types from django-stubs:
# - mypy, with the django-stubs plugin, is the reference: it knows each model's
#   fields and checks QuerySet lookups, like the mypy most Django projects run.
# - pyrefly is fast and has Django support built in; it is also the editor's language server.
# benchmarks/ is its own uv project with its own dependencies; it is not type-checked here.

[tool.mypy]
files = ["src", "tests", "docs/examples"]
mypy_path = "src"
explicit_package_bases = true
# Django's own tests, copied as they are, have no type hints.
exclude = ["tests/django_suite/[^/]+/"]  # a regular expression: every app folder
strict = true
plugins = ["mypy_django_plugin.main"]

# The apps of Django's ported tests, which mypy doesn't check (see `exclude`).
# Django's plugin still looks for them, as models of installed apps.
[[tool.mypy.overrides]]
module = [
    "aggregation.*",
    "aggregation_regress.*",
    "annotations.*",
    "async.*",
    "backends.*",
    "basic.*",
    "bulk_create.*",
    "custom_managers.*",
    "dates.*",
    "datetimes.*",
    "db_functions.*",
    "defer.*",
    "delete.*",
    "expressions.*",
    "expressions_case.*",
    "from_db_value.*",
    "get_earliest_or_latest.*",
    "get_or_create.*",
    "lookup.*",
    "many_to_many.*",
    "many_to_one.*",
    "null_queries.*",
    "or_lookups.*",
    "ordering.*",
    "prefetch_related.*",
    "queries.*",
    "reverse_lookup.*",
    "select_related.*",
    "select_related_onetoone.*",
    "select_related_regress.*",
    "transactions.*",
    "update.*",
    "update_only_fields.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pyrefly]
project-includes = ["src", "tests", "docs/examples"]
project-excludes = ["tests/django_suite/*/"]
search-path = ["src", "."]

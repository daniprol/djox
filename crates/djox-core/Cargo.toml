[package]
name = "djox-core"
description = "The shared types of djox and the Database trait every backend (SQLite, later Postgres) implements"
edition.workspace = true
license.workspace = true
publish = false  # only the Python package is published
repository.workspace = true

[dependencies]
tokio = { version = "1.54", features = ["sync"] }
# Dates and times in `Value` (Postgres returns them typed).
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml reruns these checks on the tagged commit

jobs:
  checks:
    name: Checks and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      # The same hooks developers run on commit and on push (see prek.toml).
      - name: Commit hooks (ruff, cargo fmt, file checks)
        run: uv run --frozen prek run --all-files --show-diff-on-failure
      - name: Push hooks (mypy, pyrefly, clippy, cargo test, pytest)
        run: uv run --frozen prek run --all-files --stage pre-push

  other-platforms:
    # The tests run on Linux; wheels are also built for Windows and macOS (release.yml), where
    # some code differs (Unix sockets exist only on Unix). Building here catches that before a release.
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python -c "import djox; print(djox.__version__, djox.sqlite_version)"

  django-versions:
    # Django's compiler internals change between releases, so the tests run on each supported one.
    name: Tests on Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen --with "django~=${{ matrix.django-version }}.0" pytest

  postgres:
    # The same tests on a Postgres server: the Rust backend's own tests, the
    # Python integration tests, and Django's ORM (djox's and Django's tests)
    # on `djox.backends.postgresql`. One server has TLS on, and then every
    # connection is encrypted and its certificate checked (`verify-full`).
    name: Tests on Postgres ${{ matrix.postgres-version }}${{ matrix.tls && ' with TLS' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres-version: "15"  # the oldest Django 6.1 supports
            tls: false
          - postgres-version: "18"
            tls: true
    env:
      DJOX_POSTGRES_URL: postgresql://postgres:postgres@localhost/postgres
      DJOX_TEST_DATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Start Postgres
        run: |
          tls_settings=()
          if [ "${{ matrix.tls }}" = "true" ]; then
            scripts/make-test-certificates.sh "$RUNNER_TEMP/certificates"
            # The server runs as the image's `postgres` user (999), which must own its key.
            sudo chown 999:999 "$RUNNER_TEMP/certificates/server.key"
            tls_settings=(-c ssl=on -c ssl_cert_file=/certificates/server.crt -c ssl_key_file=/certificates/server.key)
            echo "DJOX_POSTGRES_ROOT_CERT=$RUNNER_TEMP/certificates/root.crt" >> "$GITHUB_ENV"
          fi
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$RUNNER_TEMP/certificates:/certificates:ro" \
            postgres:${{ matrix.postgres-version }} "${tls_settings[@]}"
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -h localhost && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: scripts/cargo-test.sh --workspace
      - run: uv run --frozen pytest

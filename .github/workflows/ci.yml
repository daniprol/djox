name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      # The same hooks developers run on commit and on push (see prek.toml).
      - name: Commit hooks (ruff, cargo fmt, file checks)
        run: uv run --frozen prek run --all-files --show-diff-on-failure
      - name: Push hooks (ty, clippy, cargo test, pytest)
        run: uv run --frozen prek run --all-files --stage pre-push

  django-versions:
    # Django's compiler internals change between releases, so the tests run on each supported one.
    name: Tests on Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen --with "django~=${{ matrix.django-version }}.0" pytest
